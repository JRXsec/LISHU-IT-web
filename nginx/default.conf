server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.php;

    # No mostrar la versión de nginx
    server_tokens off;

    # Cabeceras de seguridad (somos una empresa de ciberseguridad ;) )
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Los .php se envían al contenedor "php" (PHP-FPM) por el puerto 9000
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Bloquear acceso directo a la carpeta includes y a ficheros ocultos
    location ^~ /includes/ { deny all; return 404; }
    location ~ /\. { deny all; }

    # Cachear estáticos
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico)$ {
        expires 7d;
        access_log off;
    }
}
