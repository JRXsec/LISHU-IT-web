services:
  # Servidor web: recibe las peticiones HTTP, sirve los estáticos (CSS, imágenes)
  # y pasa los .php al contenedor de PHP-FPM por el puerto 9000.
  nginx:
    image: nginx:1.27-alpine
    container_name: lishu-nginx
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - lishu-net
    restart: unless-stopped

  # Backend: PHP-FPM ejecuta el código PHP de la web.
  php:
    build: ./php
    container_name: lishu-php
    volumes:
      - ./src:/var/www/html
      - ./data:/var/www/data
    networks:
      - lishu-net
    restart: unless-stopped

networks:
  lishu-net:
    driver: bridge
