name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
      - name: Pruebas de la web
        run: bash tests/smoke.sh

  nginx:
    name: nginx + PHP-FPM (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Levantar contenedores
        run: docker compose up -d --build && sleep 3
      - name: Pruebas contra nginx
        run: BASE=http://localhost:8080 SKIP_FILE_CHECK=1 bash tests/smoke.sh
      - name: Logs
        if: always()
        run: docker compose logs
